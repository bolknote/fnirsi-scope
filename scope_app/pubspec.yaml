name: fnirsi_scope
description: Desktop oscilloscope workspace for the FNIRSI 2C53T remote USB protocol.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/scope-icon.png
